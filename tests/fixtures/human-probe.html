<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Human probe – JEVIS test</title>
<style>body{margin:0;height:3000px;font:16px sans-serif} #email{position:absolute;left:80px;top:80px;width:220px}
#password{position:absolute;left:80px;top:140px;width:220px} #go{position:absolute;left:640px;top:420px;width:120px;height:40px}
#far{position:absolute;left:300px;top:2200px;width:140px;height:40px}</style></head>
<body>
<input id="email" type="email" aria-label="Email" autocomplete="off">
<input id="password" type="password" aria-label="Password" autocomplete="off">
<button id="go">Continue</button>
<button id="far">Far away</button>
<script>
  window.__ev = [];
  window.__clicked = [];
  const t0 = performance.now();
  for (const t of ['mousemove', 'mousedown', 'mouseup', 'click', 'keydown', 'keyup', 'input', 'wheel']) {
    addEventListener(t, e => __ev.push({ t, x: e.clientX, y: e.clientY, k: e.key, code: e.code, shift: e.shiftKey, trusted: e.isTrusted, at: Math.round(performance.now() - t0) }), true);
  }
  for (const id of ['go', 'far']) document.getElementById(id).addEventListener('click', () => __clicked.push(id));
</script>
</body></html>
