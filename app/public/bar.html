<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title data-en="{{APP}} bar">{{APP}} çubuğu</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="bar.css">
</head>
<body>
  <div class="bar" id="bar" data-state="idle">
    <div class="row">
      <div class="mark" id="mark" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i>
      </div>
      <input id="input" type="text" autocomplete="off" spellcheck="false" aria-label="Komut" placeholder="{{APP_DAT}} söyle…" data-en-aria-label="Command" data-en-placeholder="Tell {{APP}}…">
      <button class="icon-btn" id="micBtn" type="button" title="Konuş (⌥⇧Space basılı tut)" aria-label="Konuş" data-en-title="Talk (hold ⌥⇧Space)" data-en-aria-label="Talk">
        <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
      </button>
      <button class="chip timers-chip" id="timersChip" type="button" title="Zamanlayıcılar" data-en-title="Scheduled" hidden></button>
      <button class="chip" id="modelBtn" type="button" title="Model: Hızlı (Sonnet 5.5, varsayılan) / Güçlü (Opus 5.5)" data-en-title="Model: Fast (Sonnet 5.5, the default) / Strong (Opus 5.5)" data-en="Fast">Hızlı</button>
      <button class="icon-btn" id="expandBtn" type="button" title="Büyük pencere (ayrıntılar ve geçmiş)" aria-label="Büyük pencere" data-en-title="Open the window (details and history)" data-en-aria-label="Open the window">
        <svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
    </div>
    <div class="countdown" id="countdown"></div>
    <div class="timers" id="timersPanel" hidden>
      <div class="alarm" id="alarm" hidden>
        <span class="alarm-text" id="alarmText"></span>
        <button class="alarm-cancel" id="alarmCancel" type="button" data-en="Cancel">İptal</button>
      </div>
      <ul class="timer-rows" id="timerRows"></ul>
    </div>
    <div class="panel" id="panel" hidden>
      <div class="now" id="now" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span class="now-text" id="nowText"></span>
        <button class="stop" id="stopBtn" type="button" data-en="Stop">Durdur</button>
      </div>
      <ol class="steps" id="steps"></ol>
      <div class="answer" id="answer" hidden></div>
      <div class="foot" id="foot" hidden></div>
    </div>
  </div>
  <script src="common.js"></script>
  <script src="bar.js"></script>
</body>
</html>
